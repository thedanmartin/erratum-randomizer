<!DOCTYPE html>
<html>
<head>
  <title>errata randomizer</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      cursor: url('images/sun1.png') 40 40, auto;
      cursor: -webkit-image-set(url('images/sun1-40.png') 1x, url('images/sun1.png') 2x) 20 20, auto;
    }

    #addImageBtn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      padding: 12px 24px;
      font-family: 'Arial', sans-serif;
      font-style: bold;
      font-size: 14px;
      background: #E2E9EC;
      backdrop-filter: blur(4px);
      letter-spacing: 5px;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
    }
    
    #addImageBtn:hover {
     background: red;
     color: #ffffff;
    }

    #addImageBtn:active {
      background: black
      color: #ffffff;
      text-decoration: line-through;
    }

    #imageContainer {
      position: absolute;
      inset: 0;
    }

    #imageContainer img {
      position: absolute;
      transition: opacity 1.5s linear, filter 1s ease;
      max-width: 2000px;
      max-height: 2000px;
    }
  </style>
</head>
<body>

  <button id="addImageBtn">when mistakes are made, errata are published</button>
  <div id="imageContainer"></div>

  <script>
    const button = document.getElementById("addImageBtn");
    const container = document.getElementById("imageContainer");

    const images = [
    "images/img1.png",
    "images/img2.png",
    "images/img3.png",
    "images/img4.png",
    "images/img5.png",
    "images/img6.png",
    "images/img7.png",
    "images/img8.png",
    "images/img9.png",
    "images/img10.png",
    "images/img11.png",
    "images/img12.png",
    "images/img13.png",
    "images/img14.png",
    "images/img15.png",
    "images/img16.png",
    "images/img17.png",
    "images/img18.png",
    "images/img19.png",
    "images/img20.png",
    "images/img21.png",
    "images/img22.png",
    "images/img23.png",
    "images/img24.png",
    "images/img25png",
    "images/img26.png",
    "images/img27.png",
    "images/img28.png",
    "images/img29.png",
    "images/img30.png",
    "images/img31.png",
    "images/img32.png",
    "images/img33.png",
    "images/img34.png",
    "images/img35.png",
    "images/img36.png",
    "images/img37.png",
    "images/img38.png",
    "images/img39.png",
    "images/img40.png",
    "images/img41.png",
    "images/img42.png",
    "images/img43.png",
    "images/img44.png",
    "images/img45.png",
    "images/img46.png",
    "images/img47.png",
    "images/img48.png",
    "images/img49.png",
    "images/img50.png",
    "images/img51.png",
    "images/img52.png",
    "images/img53.png",
    "images/img54.png",
    "images/img55.png",
    "images/img56.png",
    "images/img57.png",
    "images/img58.png",
    "images/img59.png",
    "images/img60.png",
    "images/img61.png",
    "images/img62.png",
    "images/img63.png",
    "images/img64.png",
    "images/img65.png",
    "images/img66.png",
    "images/img67.png",
    "images/img68.png",
    "images/img69.png",
    "images/img70.png"    
    ];

   let imageDeck = [];
   let imageCounter = 0;
   
   function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i+1));
        [array[i], array[j]] = [array[j], array[i]];
    }
   }

   const opacityStep = 0.11;
   const minOpacity = 0.12;

   button.addEventListener("click", addRandomImage);

   function addRandomImage() {
       const existingImages = container.querySelectorAll("img");

    existingImages.forEach(img => {
        
        const imageIndex = parseInt(img.dataset.index);
        const age = imageCounter - imageIndex;
        
        let currentOpacity = parseFloat(img.style.opacity) || 1;
        let newOpacity = Math.max(minOpacity, currentOpacity - opacityStep);
        img.style.opacity = newOpacity;
        
        const blurAmount = Math.min(age * 0.01, .1);
        img.style.filter = `blur(${blurAmount}px)`;
      });

      if (imageDeck.length === 0) {
        imageDeck = [...images];
        shuffleArray(imageDeck);
      }

      const selectedImage = imageDeck.pop();

      const img = document.createElement("img");
      img.src = selectedImage;
      img.style.opacity = 0;
      
      imageCounter++;
      img.dataset.index = imageCounter;

      img.onload = function () {

        const imageWidth = img.offsetWidth;
        const imageHeight = img.offsetHeight;

        const containerWidth = container.clientWidth;
        const containerHeight = container.clientHeight;

        const randomX = Math.random() * (containerWidth - imageWidth);
        const randomY = Math.random() * (containerHeight - imageHeight);

        img.style.left = randomX + "px";
        img.style.top = randomY + "px";
        
        img.style.opacity = 1;
      };

      container.appendChild(img);
    }

  </script>

</body>
</html>
